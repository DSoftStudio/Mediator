name: Sync Changelog to Docs

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync CHANGELOG.md → docs/mediator/changelog.md
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          HEADER='---
          layout: default
          title: "Changelog - DSoftStudio.Mediator"
          description: "All notable changes to DSoftStudio.Mediator."
          ---
          <p align="center">
            <picture>
              <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/DSoftStudio/Mediator/main/assets/images/DSoftStudioBgWhite.svg">
              <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/DSoftStudio/Mediator/main/assets/images/DSoftStudio.svg">
              <img alt="DSoftStudio Mediator" src="https://raw.githubusercontent.com/DSoftStudio/Mediator/main/assets/images/DSoftStudio.svg" height="120">
            </picture>
          </p>

          [← Back to Documentation](index.md)

          # Changelog'

          # Trim leading spaces from heredoc indentation
          HEADER=$(echo "$HEADER" | sed 's/^          //')

          # Strip BOM and the original "# Changelog" + subtitle lines from CHANGELOG.md
          BODY=$(sed '1s/^\xEF\xBB\xBF//' CHANGELOG.md \
            | sed '1{/^# Changelog$/d}' \
            | sed '1{/^$/d}' \
            | sed '1{/^All notable changes/d}' \
            | sed '1{/^$/d}' \
            | sed '1{/^The format is based/d}' \
            | sed '1{/^and this project adheres/d}' \
            | sed '1{/^$/d}')

          {
            echo "$HEADER"
            echo ""
            echo "$BODY"
          } > docs/mediator/changelog.md

      - name: Commit and push if changed
        run: |
          git diff --quiet docs/mediator/changelog.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/mediator/changelog.md
          git commit -m "docs: auto-sync changelog from CHANGELOG.md [skip ci]"
          git push
