name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      # The version is read out of a file, and on a pull_request that file comes
      # from the PR branch -- so it is contributor-controlled input, not ours.
      # It is checked against a version shape before going anywhere near a
      # command line or GITHUB_OUTPUT. Anything else is refused rather than
      # quoted around, because there is no legitimate <Version> that needs it.
      - name: Extract project version
        id: version
        run: |
          set -e
          raw=$(grep -oPm1 '(?<=<Version>)[^<]+' src/DSoftStudio.Mediator/DSoftStudio.Mediator.csproj)
          if ! printf '%s' "$raw" | grep -qE '^[0-9]+(\.[0-9]+){0,3}(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::<Version> is '$raw', which is not a version. Refusing to use it."
            exit 1
          fi
          echo "VERSION=$raw" >> "$GITHUB_OUTPUT"

      # ── Why there are TWO exclusion lists ──
      #
      # SonarScanner for .NET splits every file into MAIN or TEST, and each side
      # has its own exclusion property. sonar.exclusions governs main files only;
      # anything inside a project carrying <IsTestProject>true</IsTestProject> is
      # a test file, and only sonar.test.exclusions can filter it.
      #
      # So "samples/**,tests/**" in sonar.exclusions never excluded them: those
      # are test projects, and the property does not reach them. The symptom was
      # SonarCloud reporting issues in samples/cross-project-mocking, a tree this
      # repo deliberately does not analyse — and the e4 rule below, which ignores
      # every rule under tests/**, is the workaround someone reached for when
      # tests/** in sonar.exclusions turned out to do nothing.
      #
      # Both lists are kept identical: which side a directory lands on depends on
      # an MSBuild property inside it, and that is not something to have to hold
      # in your head when adding a directory here.
      #
      # Once an analysis confirms samples/ and tests/ are gone from the issue
      # list, the e4 entry becomes dead config and should be deleted.
      #
      # ── e5: S4158 in MediatorExtensionsGenerator only ──
      #
      # "Remove this call, the collection is known to be empty here" is a false
      # positive there. cacheClasses is filled exclusively inside the local
      # function CacheNameFor, and the dataflow engine does not follow the
      # mutation through the two indirect calls that reach it, so it reads the
      # list as never written. The generated MediatorExtensions.g.cs contains the
      # __SendConcreteCache_ classes that loop emits, and the file references
      # them -- the build would not compile if the collection were empty.
      #
      # Scoped to the one file rather than silenced project-wide: S4158 catches
      # real defects elsewhere and should keep doing so.
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ vars.SONAR_ORG }}
          PROJECT_VERSION: ${{ steps.version.outputs.VERSION }}
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORG"
          /v:"$PROJECT_VERSION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.exclusions="**/obj/**,**/bin/**,samples/**,benchmarks/**,docs/**,tests/**"
          /d:sonar.test.exclusions="**/obj/**,**/bin/**,samples/**,benchmarks/**,docs/**,tests/**"
          /d:sonar.coverage.exclusions="src/**/DSoftStudio.Mediator.Generators/**"
          /d:sonar.cpd.exclusions="src/**/DSoftStudio.Mediator.Generators/**"
          /d:sonar.issue.ignore.multicriteria="e1,e2,e3,e4,e5"
          /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S2326"
          /d:sonar.issue.ignore.multicriteria.e1.resourceKey="src/**/I*Request.cs"
          /d:sonar.issue.ignore.multicriteria.e2.ruleKey="csharpsquid:S3267"
          /d:sonar.issue.ignore.multicriteria.e2.resourceKey="src/**/DSoftStudio.Mediator.Generators/**"
          /d:sonar.issue.ignore.multicriteria.e3.ruleKey="csharpsquid:S2743"
          /d:sonar.issue.ignore.multicriteria.e3.resourceKey="src/**/DSoftStudio.Mediator/*Cache.cs"
          /d:sonar.issue.ignore.multicriteria.e4.ruleKey="*"
          /d:sonar.issue.ignore.multicriteria.e4.resourceKey="tests/**/*"
          /d:sonar.issue.ignore.multicriteria.e5.ruleKey="csharpsquid:S4158"
          /d:sonar.issue.ignore.multicriteria.e5.resourceKey="src/**/MediatorExtensionsGenerator.cs"

      - name: Build
        run: dotnet build DSoftStudio.Mediator.slnx -c Release --no-incremental

      - name: Test with coverage
        run: >
          dotnet test DSoftStudio.Mediator.slnx
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory:"./TestResults"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[DSoftStudio.Mediator]*,[DSoftStudio.Mediator.Abstractions]*,[DSoftStudio.Mediator.OpenTelemetry]*,[DSoftStudio.Mediator.FluentValidation]*,[DSoftStudio.Mediator.HybridCache]*"
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*.Tests]*"

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
