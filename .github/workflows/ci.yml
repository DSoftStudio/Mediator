name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:

  # ════════════════════════════════════════════════════════════════════
  #  Job 1 — Build, test, pack
  #  If ANY test fails the whole job fails and nothing gets published.
  # ════════════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      # .NET 8 is needed by the sample projects
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DSoftStudio.Mediator.slnx

      - name: Build
        run: dotnet build DSoftStudio.Mediator.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/DSoftStudio.Mediator.Tests/DSoftStudio.Mediator.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Test OpenTelemetry
        run: >
          dotnet test tests/DSoftStudio.Mediator.OpenTelemetry.Tests/DSoftStudio.Mediator.OpenTelemetry.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results-otel.trx"
          --collect:"XPlat Code Coverage"

      - name: Test FluentValidation
        run: >
          dotnet test tests/DSoftStudio.Mediator.FluentValidation.Tests/DSoftStudio.Mediator.FluentValidation.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results-fv.trx"
          --collect:"XPlat Code Coverage"

      - name: Test HybridCache
        run: >
          dotnet test tests/DSoftStudio.Mediator.HybridCache.Tests/DSoftStudio.Mediator.HybridCache.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results-hc.trx"
          --collect:"XPlat Code Coverage"

      - name: Test InternalsVisibleTo
        run: >
          dotnet test tests/DSoftStudio.Mediator.InternalsVisibleTo.Tests/DSoftStudio.Mediator.InternalsVisibleTo.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results-ivt.trx"

      # ── Artifacts (always uploaded, even on failure) ──
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/**/*.trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/**/TestResults/**/coverage.cobertura.xml

      # Post coverage summary as a PR comment
      - name: Coverage report
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: tests/**/TestResults/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both
          thresholds: '70 85'

      - name: Add coverage to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          path: code-coverage-results.md

      # ── Pack (only on main/tag, and only if all tests passed) ──
      - name: Pack NuGet packages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p nupkgs
          dotnet pack src/DSoftStudio.Mediator.Abstractions -c Release --no-build -o nupkgs
          dotnet pack src/DSoftStudio.Mediator -c Release --no-build -o nupkgs
          dotnet pack src/DSoftStudio.Mediator.FluentValidation -c Release --no-build -o nupkgs
          dotnet pack src/DSoftStudio.Mediator.HybridCache -c Release --no-build -o nupkgs
          dotnet pack src/DSoftStudio.Mediator.OpenTelemetry -c Release --no-build -o nupkgs

      - name: Upload NuGet packages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*

  # ════════════════════════════════════════════════════════════════════
  #  Job 2 — Publish
  #  Runs ONLY after build-and-test succeeds (all tests green).
  #  Downloads the pre-built .nupkg artifacts — no rebuild needed.
  # ════════════════════════════════════════════════════════════════════
  publish:
    name: Publish NuGet packages
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs

      - name: List packages
        run: ls -la nupkgs/

      # Push to GitHub Packages (every push to main)
      - name: Push to GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/DSoftStudio/index.json"
          --api-key "${{ secrets.GH_PKG_TOKEN }}"
          --skip-duplicate

      # Push to NuGet.org (only on version tags: v*)
      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate
