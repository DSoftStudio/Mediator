<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% seo %}
    <!-- Structured data: TechArticle -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TechArticle",
      "headline": "{{ page.title | default: site.title | escape }}",
      "name": "{{ page.title | default: site.title | escape }}",
      "description": "{{ page.description | default: site.description | escape }}",
      "url": "{{ page.url | absolute_url }}",
      "datePublished": "2026-03-15",
      "dateModified": "2026-03-25",
      "image": "https://raw.githubusercontent.com/DSoftStudio/Mediator/main/assets/images/DSoftStudio.svg",
      "author": {
        "@type": "Organization",
        "name": "DSoftStudio",
        "url": "https://dsoftstudio.com"
      },
      "publisher": {
        "@type": "Organization",
        "name": "DSoftStudio",
        "url": "https://dsoftstudio.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://raw.githubusercontent.com/DSoftStudio/Mediator/main/assets/images/DSoftStudio.svg"
        }
      },
      "isPartOf": {
        "@type": "WebSite",
        "name": "DSoftStudio Mediator Documentation",
        "url": "{{ site.url }}"
      },
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ page.url | absolute_url }}"
      }
    }
    </script>
    <!-- Structured data: BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Documentation",
          "item": "{{ '/mediator/' | absolute_url }}"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "{{ page.title | default: site.title | escape }}",
          "item": "{{ page.url | absolute_url }}"
        }
      ]
    }
    </script>
    <!-- Structured data: SoftwareApplication (NuGet library) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareSourceCode",
      "name": "DSoftStudio.Mediator",
      "description": "Ultra-low-latency mediator for .NET with compile-time dispatch, zero-allocation pipelines, and Native AOT support.",
      "url": "https://docs.dsoftstudio.com/mediator/",
      "codeRepository": "https://github.com/DSoftStudio/Mediator",
      "programmingLanguage": "C#",
      "runtimePlatform": ".NET",
      "license": "https://opensource.org/licenses/MIT",
      "author": {
        "@type": "Organization",
        "name": "DSoftStudio",
        "url": "https://dsoftstudio.com"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <style>
      /* Override minimal theme fixed-width section */
      .wrapper { max-width: 960px; margin: 0 auto; padding: 20px; width: 100%; }
      section { width: 100%; float: none; padding-bottom: 50px; }
      /* Roboto font family */
      body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      code, pre { font-family: 'Roboto Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      h1, h2, h3, h4, h5, h6 { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <section>
        {{ content }}
      </section>
    </div>
    {% if page.mermaid %}
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      // Jekyll renders ```mermaid as <pre><code class="language-mermaid">
      // Mermaid.js needs <pre class="mermaid"> — convert them
      document.querySelectorAll('code.language-mermaid').forEach(code => {
        const pre = code.parentElement;
        pre.className = 'mermaid';
        pre.textContent = code.textContent;
      });
      mermaid.initialize({ startOnLoad: true });
    </script>
    {% endif %}
  </body>
</html>
