title: DSoftStudio.Mediator Documentation
description: "Source-generated mediator for .NET with compile-time dispatch, zero-allocation pipelines, and Native AOT support."
url: https://docs.dsoftstudio.com
baseurl: ""
lang: en-US

# SEO — jekyll-seo-tag uses these for og:image and twitter:card
logo: https://raw.githubusercontent.com/DSoftStudio/Mediator/main/assets/images/DSoftStudio.svg
image: https://raw.githubusercontent.com/DSoftStudio/Mediator/main/assets/images/og-image.png
twitter:
  card: summary_large_image
social:
  name: DSoftStudio
  links:
    - https://github.com/DSoftStudio/Mediator

# Theme
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links

# Hide the default header/title — each page has its own
show_downloads: false

# Force custom layout on every page
defaults:
  - scope:
      path: ""
    values:
      layout: default
